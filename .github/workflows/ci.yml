name: CI

# Manifest and description checks only - both are pure text/git checks needing no
# API key. Fixture regression checks (tests/fixtures/*/check.sh) are deliberately
# NOT run here: they invoke `claude -p`, so they need an API key and grade
# non-deterministic output. Contributors run those locally - see CONTRIBUTING.md.

on:
  push:
  pull_request:

jobs:
  manifests:
    name: manifests, version bump, skill descriptions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # version check needs the base commit and merge-base

      - name: Validate manifests and version bump
        run: |
          tests/check_version_bump.sh "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"

      - name: Check skill trigger wording for overlap (warning only)
        run: python3 tests/check_descriptions.py
